  <style>

    body { background: #000000; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000000; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }

      This page requires JavaScript to display.
    </div>

  <div id="__bundler_thumbnail"><svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="800" fill="#000"></rect><rect x="360" y="260" width="140" height="280" fill="#fff"></rect><rect x="530" y="260" width="140" height="280" fill="#fff"></rect><rect x="700" y="260" width="140" height="280" fill="#007262"></rect></svg></div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

n}\n/* cyrillic */\n@font-face {\n  font-family: 'Roboto Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"8caceaa4-e12c-45bc-91b8-1ba2662867ad\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'Roboto Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"8603513c-ae2e-4e74-8489-aa42a69a2026\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Roboto Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"d768cbe9-24a7-4082-acc3-6492c758bf76\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Roboto Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"62dafa7f-eb19-4392-9d43-066a50630a08\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Roboto Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"901a7683-2856-4704-aaa8-67627b56483c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root{\n  --font-core:\"Avenir\",\"Avenir Next\",\"Nunito Sans\",\"Helvetica Neue\",Helvetica,Tahoma,Verdana,Arial,sans-serif;\n  /* Numeric / tabular data: gold weights, prices, account balances */\n  --font-mono:\"Roboto Mono\",ui-monospace,\"SF Mono\",Menlo,Consolas,monospace;\n  /* Semi-handwritten, personal occasions only (celebratory cards, seating cards,\n     personally addressed occasions). Never for body copy or legal documents. */\n  --font-script:\"Brush Script MT\",\"Brush Script Std\",\"Segoe Script\",cursive;\n}\n\n/* Base palette — values transcribed from Voima Brand Book 2025 (pp. 24–29),\n   plus the Voima Supply green sampled from the supplied CMYK logo artwork. */\n:root{\n  /* Main brand colours. Black and white are the brand; everything else is functional. */\n  --black:#000000;\n  --white:#ffffff;\n  /* Rich black as it appears in the logo artwork (CMYK 60/60/60/100) */\n  --black-rich:#040707;\n\n  /* Neutral backgrounds (light) */\n  --almost-white:#FAFAFA;\n  --light-grey:#EEEEEE;\n  --light-concrete:#CFCDC4;\n  --medium-concrete:#BAB9B0;\n\n  /* Neutral backgrounds (dark) */\n  --medium-night:#222328;\n  --dark-night:#0B0C0F;\n\n  /* Functional colours — light mode */\n  --interactive:#1900FF;\n  --positive:#00AD00;\n  --negative:#FF2E00;\n  --alert:#FFDE00;\n\n  /* Functional colours — dark mode variants */\n  --interactive-dark:#509AFF;\n  --positive-dark:#009D00;\n  --negative-dark:#DF2E00;\n  --alert-dark:#EFCE00;\n\n  /* Schematic gold. Only ever for diagrams, charts and data — never to imitate\n     real gold on a surface, a button or a letterform. */\n  --gold-schematic:#F7B500;\n\n  /* Voima Supply — the retail brand. Sampled from Voima_Logo_CMYK_Supply artwork. */\n  --supply-green:#007262;\n  --supply-green-hover:#005B4E;\n  --supply-green-tint:#E5F0EE;\n\n  /* Legacy — obsolete. Only for retro or backwards-consistency work. */\n  --legacy-kulta:#E1B87F;\n  --legacy-royal-blue:#0C2340;\n\n  /* Illustration / chart palette. Approximate sRGB renderings of the CMYK mixes\n     printed on p.27 of the Brand Book — verify against the CMYK values before print. */\n  --chart-warm-1:#FFF000; /* C0  M5   Y100 K0  */\n  --chart-warm-2:#F8B5D4; /* C0  M30  Y0   K0  */\n  --chart-warm-3:#F7B500; /* C0  M30  Y100 K0  */\n  --chart-warm-4:#F07E1A; /* C0  M60  Y100 K0  */\n  --chart-warm-5:#E3001B; /* C0  M100 Y100 K0  */\n  --chart-warm-6:#E5006E; /* C5  M100 Y0   K0  */\n  --chart-cool-1:#00A64F; /* C100 M0  Y100 K0  */\n  --chart-cool-2:#0093DD; /* C100 M15 Y0   K0  */\n  --chart-cool-3:#1B3D97; /* C100 M70 Y0   K0  */\n  --chart-cool-4:#742B8F; /* C60  M100 Y0  K0  */\n}\n\n/* Type is functional: higher hierarchy = larger and/or heavier. Never more than\n   four weight/style combinations visible at once (Brand Book p.32). */\n:root{\n  --font-weight-light:300;\n  --font-weight-regular:400;\n  --font-weight-medium:600;\n  --font-weight-bold:700;\n  --font-weight-heavy:800;\n  --font-weight-black:900;\n\n  /* Sizes — 1.25 ratio above body, tightened below */\n  --text-2xs:11px;\n  --text-xs:12px;\n  --text-sm:14px;\n  --text-base:16px;\n  --text-md:18px;\n  --text-lg:22px;\n  --text-xl:28px;\n  --text-2xl:36px;\n  --text-3xl:46px;\n  --text-4xl:58px;\n  --text-5xl:74px;\n  --text-6xl:96px;\n\n  --leading-tight:1.05;\n  --leading-snug:1.2;\n  --leading-normal:1.45;\n  --leading-relaxed:1.6;\n\n  /* Display sizes get negative tracking; ALL CAPS labels get positive tracking. */\n  --tracking-display:-0.02em;\n  --tracking-tight:-0.01em;\n  --tracking-normal:0;\n  --tracking-caps:0.09em;\n  --tracking-caps-wide:0.16em;\n\n  /* Named roles */\n  --type-display:var(--font-weight-heavy) var(--text-4xl)/var(--leading-tight) var(--font-core);\n  --type-h1:var(--font-weight-bold) var(--text-3xl)/var(--leading-snug) var(--font-core);\n  --type-h2:var(--font-weight-bold) var(--text-2xl)/var(--leading-snug) var(--font-core);\n  --type-h3:var(--font-weight-bold) var(--text-xl)/var(--leading-snug) var(--font-core);\n  --type-h4:var(--font-weight-bold) var(--text-md)/var(--leading-snug) var(--font-core);\n  --type-body:var(--font-weight-regular) var(--text-base)/var(--leading-normal) var(--font-core);\n  --type-body-sm:var(--font-weight-regular) var(--text-sm)/var(--leading-normal) var(--font-core);\n  --type-lead:var(--font-weight-light) var(--text-lg)/var(--leading-relaxed) var(--font-core);\n  --type-label:var(--font-weight-bold) var(--text-xs)/1.2 var(--font-core);\n  --type-numeric:var(--font-weight-medium) var(--text-base)/1.3 var(--font-mono);\n}\n\n/* 4px base grid. Voima layouts are generous and rectangular; whitespace is\n   defined by lines and negative space rather than by decoration. */\n:root{\n  --space-0:0px;\n  --space-1:4px;\n  --space-2:8px;\n  --space-3:12px;\n  --space-4:16px;\n  --space-5:20px;\n  --space-6:24px;\n  --space-8:32px;\n  --space-10:40px;\n  --space-12:48px;\n  --space-16:64px;\n  --space-20:80px;\n  --space-24:96px;\n  --space-32:128px;\n\n  --gutter:var(--space-6);\n  --page-margin:var(--space-8);\n  --container-max:1280px; /* @kind spacing */\n  --measure:68ch; /* @kind other */      /* comfortable reading width */\n  --hit-target:44px;   /* minimum interactive target */\n}\n\n/* Lines are functional: they highlight, connect, isolate, group or define\n   negative space (Brand Book p.34). Flat caps, solid or dashed, no waves.\n   Corners are square — the brand has \"no need for unnecessary ornaments\". */\n:root{\n  --radius-none:0px;\n  --radius-hairline:1px; /* optical softening only, e.g. inputs on dark surfaces */\n  --radius-pill:999px;   /* only for genuinely capsule objects: chips, counters */\n\n  --border-hair:1px;\n  --border-regular:2px;\n  --border-heavy:3px;\n  --border-rule:4px;     /* section rule, matched to bold type weight */\n\n  --border-style-solid:solid; /* @kind other */\n  --border-style-dashed:dashed; /* @kind other */\n\n  /* The Supply slant: measured from the supplied logo artwork (31.4° off vertical).\n     Use for the SUPPLY-style flag/banner motif only, never on body containers. */\n  --slant-angle:31.4deg; /* @kind other */\n  --slant:skewX(-31.4deg); /* @kind other */\n  --slant-reverse:skewX(31.4deg); /* @kind other */\n}\n\n/* Voima does not float things for decoration. Depth comes from flat colour\n   fields and hairline rules. Shadows are reserved for surfaces that genuinely\n   sit above the page (dialogs, menus) and stay near-black and tight. */\n:root{\n  --shadow-none:none;\n  --shadow-raised:0 1px 0 0 rgba(0,0,0,.12);\n  --shadow-overlay:0 2px 24px rgba(0,0,0,.18);\n  --shadow-dialog:0 8px 48px rgba(0,0,0,.32);\n  --shadow-focus:0 0 0 3px rgba(25,0,255,.35);\n  --shadow-focus-dark:0 0 0 3px rgba(80,154,255,.45);\n\n  /* Protection: for type over photography, prefer a flat black or white plate\n     (a \"capsule\") over a gradient. Gradient scrims only on full-bleed imagery. */\n  --scrim-bottom:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,0) 62%); /* @kind other */\n  --scrim-flat:rgba(0,0,0,.72);\n  --blur-overlay:saturate(120%) blur(18px); /* @kind other */\n}\n\n/* Motion is sober and mechanical: short, linear-ish, no bounce, no overshoot.\n   Gold does not wobble. Prefer opacity and colour changes over movement. */\n:root{\n  --duration-instant:80ms; /* @kind other */\n  --duration-fast:140ms; /* @kind other */\n  --duration-base:200ms; /* @kind other */\n  --duration-slow:320ms; /* @kind other */\n  --duration-page:480ms; /* @kind other */\n\n  --ease-standard:cubic-bezier(.2,0,.2,1); /* @kind other */\n  --ease-out:cubic-bezier(0,0,.2,1); /* @kind other */\n  --ease-in:cubic-bezier(.4,0,1,1); /* @kind other */\n  --ease-linear:linear; /* @kind other */\n\n  --transition-interactive:color var(--duration-fast) var(--ease-standard),background-color var(--duration-fast) var(--ease-standard),border-color var(--duration-fast) var(--ease-standard),opacity var(--duration-fast) var(--ease-standard); /* @kind other */\n}\n\n/* Semantic aliases. Components reference these, never the raw palette,\n   so a surface can be flipped to dark mode by scope. */\n:root{\n  --text-primary:var(--black);\n  --text-secondary:#4A4A4A;\n  --text-muted:#767671;\n  --text-inverse:var(--white);\n  --text-link:var(--inte div>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"overflow:auto;padding:24px 32px;display:flex;flex-direction:column;gap:16px;min-width:0\">\n          <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n            <h2 style=\"margin:0;font-size:18px;font-weight:700\">{{ mid.title }}<\u002Fh2>\n            <sc-if value=\"{{ mid.showLabel }}\" hint-placeholder-val=\"{{ false }}\">\n              <x-import component-from-global-scope=\"VoimaSupplyDesignSystem_a2af6f.Badge\" tone=\"{{ mid.labelTone }}\" hint-size=\"auto,22px\">{{ mid.label }}<\u002Fx-import>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ mid.edited }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12px;color:var(--text-secondary)\">Edited by reviewer<\u002Fspan><\u002Fsc-if>\n            <span style=\"margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--text-muted)\">{{ mid.meta }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ mid.showLabel }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:14px;color:var(--text-secondary);line-height:1.45;margin-top:-6px;text-wrap:pretty\">{{ mid.explain }}<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ mid.outdated }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;gap:16px;align-items:flex-start;padding:16px;background:var(--white);border:2px solid var(--black)\">\n              <span style=\"flex:none;background:var(--alert);color:var(--black);font-size:11px;font-weight:700;letter-spacing:0.09em;padding:4px 8px\">SOURCE UPDATED<\u002Fspan>\n              <div style=\"flex:1;display:flex;flex-direction:column;gap:4px\">\n                <div style=\"font-weight:700;font-size:14px\">This draft uses an older document version<\u002Fdiv>\n                <div style=\"font-size:14px;color:var(--text-secondary);line-height:1.45\">{{ mid.outdatedText }}<\u002Fdiv>\n              <\u002Fdiv>\n              <x-import component-from-global-scope=\"VoimaSupplyDesignSystem_a2af6f.Button\" variant=\"primary\" size=\"sm\" sc-camel-on-click=\"{{ regenerate }}\" hint-size=\"auto,36px\">Regenerate<\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ mid.conflict }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;gap:16px;align-items:flex-start;padding:16px;background:var(--white);border:2px solid var(--black)\">\n              <span style=\"flex:none;background:var(--alert);color:var(--black);font-size:11px;font-weight:700;letter-spacing:0.09em;padding:4px 8px\">CONFLICT<\u002Fspan>\n              <div style=\"flex:1;display:flex;flex-direction:column;gap:4px\">\n                <div style=\"font-weight:700;font-size:14px\">Sources disagree: {{ mid.conflictTopic }}<\u002Fdiv>\n                <div style=\"font-size:14px;color:var(--text-secondary);line-height:1.45\">{{ mid.conflictSummary }} Both passages are shown in the evidence panel.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ mid.reapprove }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:12px 16px;background:var(--white);border:1px solid var(--border-default);font-size:14px;line-height:1.45\"><strong>Edited after approval.<\u002Fstrong> The previous approval is kept as a record. This version needs approval again.<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ mid.noDraft }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:var(--white);border:1px solid var(--border-subtle);padding:40px 32px;display:flex;flex-direction:column;align-items:flex-start;gap:16px\">\n              <div style=\"font-size:18px;font-weight:700\">No draft yet<\u002Fdiv>\n              <div style=\"font-size:14px;color:var(--text-secondary);line-height:1.5;max-width:52ch\">The assistant searches current document versions, applies this customer's plan and account details, and cites every factual claim.<\u002Fdiv>\n              <x-import component-from-global-scope=\"VoimaSupplyDesignSystem_a2af6f.Button\" variant=\"accent\" sc-camel-on-click=\"{{ generate }}\" hint-size=\"auto,44px\">Generate draft<\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ mid.generating }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:var(--white);border:1px solid var(--border-subtle);padding:28px 32px;display:flex;flex-direction:column;gap:20px\">\n              <div style=\"height:4px;background:var(--light-grey)\"><div style=\"height:4px;width:{{ mid.genPct }};background:var(--black);transition:width 600ms cubic-bezier(.2,0,.2,1)\"><\u002Fdiv><\u002Fdiv>\n              <sc-for list=\"{{ mid.genSteps }}\" as=\"g\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:center;gap:12px;font-size:14px;color:{{ g.fg }};font-weight:{{ g.weight }}\">\n                  <span style=\"width:20px;font-family:var(--font-mono)\">{{ g.mark }}<\u002Fspan>{{ g.label }}\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"font-size:12px;color:var(--text-muted)\">Approval is unavailable while the draft is generating.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ mid.failed }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:var(--white);border:2px solid var(--negative);padding:24px;display:flex;flex-direction:column;align-items:flex-start;gap:12px\">\n              <div style=\"display:flex;align-items:center;gap:10px\">\n                <x-import component-from-global-scope=\"VoimaSupplyDesignSystem_a2af6f.Badge\" tone=\"negative\" hint-size=\"auto,22px\">Failed<\u002Fx-import>\n                <span style=\"font-weight:700;font-size:16px\">The draft could not be generated<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:14px;color:var(--text-secondary);line-height:1.5\">The model request timed out after retrieval (simulated). No draft was saved, and nothing was sent to the customer.<\u002Fdiv>\n              <x-import component-from-global-scope=\"VoimaSupplyDesignSystem_a2af6f.Button\" variant=\"primary\" size=\"sm\" sc-camel-on-click=\"{{ generate }}\" hint-size=\"auto,36px\">Retry<\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ mid.showText }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:var(--white);border:1px solid var(--border-subtle);padding:28px 32px;display:flex;flex-direction:column;gap:16px;font-size:16px;line-height:1.6;max-width:72ch\">\n              <sc-for list=\"{{ mid.paras }}\" as=\"p\" hint-placeholder-count=\"2\">\n                <p style=\"margin:0;text-wrap:pretty\"><sc-for list=\"{{ p.parts }}\" as=\"pt\"><sc-if value=\"{{ pt.isText }}\">{{ pt.t }}<\u002Fsc-if><sc-if value=\"{{ pt.isCite }}\"><button sc-camel-on-click=\"{{ pt.onClick }}\" title=\"Show evidence\" style=\"display:inline-grid;place-items:center;min-width:22px;height:20px;margin:0 2px;padding:0 5px;border:1px solid var(--black);background:{{ pt.bg }};color:{{ pt.fg }};font-family:var(--font-mono);font-size:11px;font-weight:700;cursor:pointer;vertical-align:2px\">{{ pt.label }}<\u002Fbutton><\u002Fsc-if><\u002Fsc-for><\u002Fp>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ mid.editing }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:8px;max-width:72ch\">\n              <textarea value=\"{{ editText }}\" sc-camel-on-change=\"{{ onEditText }}\" style=\"min-height:260px;padding:20px 24px;border:2px solid var(--black);background:var(--white);font:inherit;font-size:16px;line-height:1.6;resize:vertical;border-radius:0\"><\u002Ftextarea>\n              <div style=\"font-size:12px;color:var(--text-muted)\">Keep citation markers like [1] next to the claims they support.<\u002Fdiv>\n              <div style=\"display:flex;gap:8px\">\n                <x-import component-from-global-scope=\"VoimaSupplyDesignSystem_a2af6f.Button\" variant=\"primary\" size=\"sm\" sc-camel-on-click=\"{{ saveEdit }}\" hint-size=\"auto,36px\">Save edit<\u002Fx-import>\n                <x-import component-from-global-scope=\"VoimaSupplyDesignSystem_a2af6f.Button\" variant=\"ghost\" size=\"sm\" sc-camel-on-click=\"{{ cancelEdit }}\" hint-size=\"auto,36px\">Cancel<\u002Fx-import>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ mid.missing }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:var(--white);border:1px solid var(--border-subtle);padding:20px 24px;display:flex;flex-direction:column;gap:12px;max-width:72ch\">\n              <div style=\"font-size:12px;font-weight:700;letter-spacing:0.09em;color:var(--text-secondary)\">NOT ESTABLISHED BY THE DOCUMENTATION<\u002Fdiv>\n              <sc-for list=\"{{ mid.unknowns }}\" as=\"u\" hint-placeholder-count=\"2\">\n                <div style=\"display:flex;gap:10px;font-size:14px;line-height:1.5\"><span>✦<\u002Fspan><span>{{ u }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"display:flex;align-items:center;gap:12px;padding-top:4px\">\n                <sc-if value=\"{{ mid.canRequest }}\" hint-placeholder-val=\"{{ true }}\">\n                  <x-import component-from-global-scope=\"VoimaSupplyDesignSystem_a2af6f.Button\" variant=\"secondary\" size=\"sm\" sc-camel-on-click=\"{{ requestReview }}\" hint-size=\"auto,36px\">Request review from Payments<\u002Fx-import>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ mid.requested }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"font-size:14px\"><strong>Review requested<\u002Fstrong> · Payments team · {{ mid.requestedAt }}<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ mid.approved }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:var(--white);border:1px solid var(--border-subtle);max-width:72ch\">\n              <div style=\"display:flex;align-items:center;gap:10px;padding:14px 24px;border-bottom:1px solid var(--border-subtle)\">\n                <x-import component-from-global-scope=\"VoimaSupplyDesignSystem_a2af6f.Badge\" tone=\"positive\" hint-size=\"auto,22px\">Approved<\u002Fx-import>\n                <span style=\"font-size:14px;font-weight:700\">Approval record<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ mid.record }}\" as=\"rc\" hint-placeholder-count=\"3\">\n                <div style=\"display:grid;grid-template-columns:140px minmax(0,1fr);gap:12px;padding:12px 24px;border-bottom:1px solid var(--border-subtle);font-size:14px\">\n                  <span style=\"color:var(--text-muted)\">{{ rc.k }}<\u002Fspan><span style=\"font-weight:600\">{{ rc.v }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ mid.historicalNote }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:12px 24px;font-size:14px;color:var(--text-secondary);line-height:1.45\">{{ mid.historicalNote }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ mid.showActions }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--border-subtle);max-width:72ch\">\n              <sc-if value=\"{{ mid.canRegen }}\" hint-placeholder-val=\"{{ true }}\">\n                <x-import component-from-global-scope=\"VoimaSupplyDesignSystem_a2af6f.Button\" variant=\"secondary\" size=\"sm\" disabled=\"{{ mid.busy }}\" sc-camel-on-click=\"{{ regenerate }}\" hint-size=\"auto,36px\">Regenerate<\u002Fx-import>\n              <\u002Fsc-if>\n              <x-import component-from-global-scope=\"VoimaSupplyDesignSystem_a2af6f.Button\" variant=\"ghost\" size=\"sm\" disabled=\"{{ mid.busy }}\" sc-camel-on-click=\"{{ startEdit }}\" hint-size=\"auto,36px\">{{ mid.editLabel }}<\u002Fx-import>\n              <span style=\"margin-left:auto;font-size:12px;color:var(--text-secondary);text-align:right;max-width:30ch\">{{ mid.approveHint }}<\u002Fspan>\n              <sc-if value=\"{{ mid.showApprove }}\" hint-placeholder-val=\"{{ true }}\">\n                <x-import component-from-global-scope=\"VoimaSupplyDesignSystem_a2af6f.Button\" variant=\"accent\" size=\"sm\" disabled=\"{{ mid.approveDisabled }}\" sc-camel-on-click=\"{{ approve }}\" hint-size=\"auto,36px\">Approve<\u002Fx-import>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsection>\n\n        <section style=\"overflow:auto;border-left:1px solid var(--border-subtle);background:var(--white);padding:24px;display:flex;flex-direction:column;gap:16px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:8px\">\n            <div style=\"font-size:12px;font-weight:700;letter-spacing:0.09em;color:var(--text-secondary)\">EVIDENCE<\u002Fdiv>\n            <span style=\"font-size:12px;color:var(--text-muted)\">{{ ev.caption }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ ev.empty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:14px;color:var(--text-secondary);line-height:1.5;padding:16px;background:var(--almost-white);border:1px solid var(--border-subtle)\">{{ ev.emptyText }}<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ ev.conflict }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border:2px solid var(--black)\">\n              <div style=\"background:var(--alert);color:var(--black);padding:8px 14px;font-size:12px;font-weight:700;letter-spacing:0.09em\">CONFLICTING SOURCES<\u002Fdiv>\n              <sc-for list=\"{{ ev.conflictItems }}\" as=\"e\" hint-placeholder-count=\"2\">\n                <div style=\"padding:14px;border-bottom:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:8px;background:{{ e.bg }}\">\n                  <div style=\"display:flex;align-items:center;gap:8px\">\n                    <span style=\"font-family:var(--font-mono);font-size:11px;font-weight:700;border:1px solid var(--black);padding:1px 6px\">{{ e.n }}<\u002Fspan>\n                    <span style=\"font-weight:700;font-size:14px;flex:1\">{{ e.title }}<\u002Fspan>\n                    <span style=\"font-size:12px;color:var(--text-secondary)\">{{ e.kind }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-family:var(--font-mono);font-size:12px;color:var(--text-secondary)\">v{{ e.v }} · Effective {{ e.eff }}<\u002Fdiv>\n                  <div style=\"font-size:14px;line-height:1.5\"><span style=\"font-weight:700\">{{ e.h }}.<\u002Fspan> {{ e.t }}<\u002Fdiv>\n                  <a href=\"#\" sc-camel-on-click=\"{{ e.onOpen }}\" style=\"font-size:12px;font-weight:600\">Inspect full document<\u002Fa>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"padding:12px 14px;font-size:13px;line-height:1.45;color:var(--text-secondary)\">Policy documents normally take precedence over FAQs. The draft follows the policy.<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ toggleAck }}\" style=\"display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 14px;border:0;border-top:1px solid var(--border-subtle);background:var(--almost-white);font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:left;color:var(--black)\">\n                <span style=\"width:18px;height:18px;border:2px solid var(--black);display:grid;place-items:center;background:{{ ev.ackBg }};color:var(--white);font-size:12px\">{{ ev.ackMark }}<\u002Fspan>\n                I've inspected both sources\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-for list=\"{{ ev.items }}\" as=\"e\" hint-placeholder-count=\"2\">\n            <div sc-camel-on-click=\"{{ e.onClick }}\" style=\"border:{{ e.border }};padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;background:var(--white)\">\n              <div style=\"display:flex;align-items:center;gap:8px\">\n                <span style=\"font-family:var(--font-mono);font-size:11px;font-weight:700;border:1px solid var(--black);padding:1px 6px;background:{{ e.nBg }};color:{{ e.nFg }}\">{{ e.n }}<\u002Fspan>\n                <span style=\"font-weight:700;font-size:14px;flex:1\">{{ e.title }}<\u002Fspan>\n                <sc-if value=\"{{ e.superseded }}\" hint-placeholder-val=\"{{ false }}\">\n                  <x-import component-from-global-scope=\"VoimaSupplyDesignSystem_a2af6f.Badge\" tone=\"alert\" hint-size=\"auto,22px\">Superseded<\u002Fx-import>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"font-family:var(--font-mono);font-size:12px;color:var(--text-secondary)\">v{{ e.v }} · Effective {{ e.eff }}<\u002Fdiv>\n              <div style=\"font-size:14px;line-height:1.55;padding:8px 10px;margin:0 -10px;background:{{ e.bg }}\"><span style=\"font-weight:700\">{{ e.h }}.<\u002Fspan> {{ e.t }}<\u002Fdiv>\n              <a href=\"#\" sc-camel-on-click=\"{{ e.onOpen }}\" style=\"font-size:12px;font-weight:600\">Open document<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isKb }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;overflow:auto;padding:32px\">\n        <div style=\"max-width:1280px;display:flex;flex-direction:column;gap:24px\">\n          <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:24px\">\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <h1 style=\"margin:0;font-size:28px;font-weight:700\">Knowledge base<\u002Fh1>\n              <div style=\"font-size:14px;color:var(--text-secondary)\">Answers search current, indexed versions only. Archived documents are never retrieved.<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasDocs }}\" hint-placeholder-val=\"{{ true }}\">\n              <x-import component-from-global-scope=\"VoimaSupplyDesignSystem_a2af6f.Button\" variant=\"primary\" sc-camel-on-click=\"{{ openUpload }}\" hint-size=\"auto,44px\">Upload document<\u002Fx-import>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ noDocs }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:var(--white);border:1px solid var(--border-subtle);padding:56px 40px;display:flex;flex-direction:column;align-items:flex-start;gap:16px\">\n              <div style=\"font-size:22px;font-weight:700\">No documents yet<\u002Fdiv>\n              <div style=\"font-size:16px;color:var(--text-secondary);line-height:1.5;max-width:56ch\">Upload plan sheets, policies and FAQs. The assistant can only answer from documents that have finished indexing.<\u002Fdiv>\n              <div style=\"display:flex;gap:8px\">\n                <x-import component-from-global-scope=\"VoimaSupplyDesignSystem_a2af6f.Button\" variant=\"primary\" sc-camel-on-click=\"{{ openUpload }}\" hint-size=\"auto,44px\">Upload document<\u002Fx-import>\n                <x-import component-from-global-scope=\"VoimaSupplyDesignSystem_a2af6f.Button\" variant=\"secondary\" sc-camel-on-click=\"{{ loadDemo }}\" hint-size=\"auto,44px\">Load demo data<\u002Fx-import>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ hasDocs }}\" hint-placeholder-val=\"{{
